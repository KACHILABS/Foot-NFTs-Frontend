<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FOOT NFTs - Maintenance</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0A0A0F !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background layers */
        .abstract-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .abstract-glow svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            opacity: 0.13;
            filter: blur(120px);
        }

        .grid-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(34, 197, 94, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 197, 94, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .glow {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 20%, rgba(34, 197, 94, 0.08), transparent 60%);
            pointer-events: none;
            z-index: 2;
        }

        .glow2 {
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 70% 80%, rgba(34, 197, 94, 0.06), transparent 60%);
            pointer-events: none;
            z-index: 2;
        }

        .maintenance-container {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: #22c55e;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 24px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .time-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .time-value {
            font-family: 'Oxanium', sans-serif;
            font-size: 48px;
            font-weight: 800;
            color: #22c55e;
            letter-spacing: 4px;
        }

        .message {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin: 20px 0;
        }

        .status {
            display: inline-block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 30px;
            padding: 8px 20px;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #22c55e;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 10px;
            color: #4b5563;
            font-family: 'Space Mono', monospace;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Layer 0: Abstract SVG glow -->
    <div class="abstract-glow">
        <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <path d="M500 100 L700 300 L600 800 L300 900 L200 400 Z" fill="#00C853"/>
        </svg>
    </div>

    <!-- Layer 1: Grid lines -->
    <div class="grid-lines"></div>

    <!-- Layer 2: Radial glows -->
    <div class="glow"></div>
    <div class="glow2"></div>

    <!-- Layer 3: Maintenance Content -->
    <div class="maintenance-container">
        <div class="card">
            <div class="icon">⚙️🛠️</div>
            <h1>Server Maintenance</h1>
            <div class="subtitle">Ongoing</div>
            
            <div class="time-box">
                <div class="time-label">Expected resolution</div>
                <div class="time-value pulse">72 HRS</div>
            </div>
            
            <p class="message">
                We're upgrading our servers to serve you better.<br>
                Our team is working hard to restore full functionality.
            </p>
            
            <div class="status">
                🚀 Coming back stronger
            </div>
            
            <div class="footer">
                FOOT NFTs • Built for fans
            </div>
        </div>
    </div>

    <script>
        // Telegram WebApp setup
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.disableVerticalSwipes?.();
            window.Telegram.WebApp.backgroundColor = '#0A0A0F';
            window.Telegram.WebApp.setHeaderColor('bg_color');
        }
    </script>
</body>
                </html>
