
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Maintenance | FOOT NFTs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 380px;
            padding: 20px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            color: #22c55e;
        }
        .message {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .time {
            font-size: 32px;
            font-weight: 800;
            color: #22c55e;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .divider {
            width: 50px;
            height: 2px;
            background: #22c55e;
            margin: 25px auto;
            opacity: 0.5;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #4b5563;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️🛠️</div>
        <h1>Server Maintenance</h1>
        <div class="message">Ongoing</div>
        <div class="time pulse">72 HRS</div>
        <p>We'll be right back up in <strong style="color:#22c55e">72 hours</strong></p>
        <div class="divider"></div>
        <p>We're upgrading our servers to serve you better.<br>Thank you for your patience.</p>
        <div class="footer">
            FOOT NFTs • Built for fans
        </div>
    </div>
</body>
          </html>
